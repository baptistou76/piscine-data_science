services:
  postgres:
    image: postgres:15
    container_name: postgres_piscine
    restart: always
    environment:
      POSTGRES_USER: bcaumont
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: piscineds
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: