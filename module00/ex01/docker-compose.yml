services:
  postgres:
    image: postgres:15
    container_name: postgres_piscine
    restart: always
    environment:
      POSTGRES_USER: bcaumont
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: piscineds
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./subject:/subject

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_piscine
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: 
      - "8080:80"
    depends_on:
      - postgres

volumes:
  pg_data: